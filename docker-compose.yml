volumes:
  opensearch-data:
  prometheus-data:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reservas_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reservas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Keep this aligned with the shared observability configs mounted below.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "ChangeMe_123!"
      plugins.query.datasources.encryption.masterkey: ${OPENSEARCH_DATASOURCE_MASTERKEY:-0123456789abcdef01234567}
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:ChangeMe_123! https://localhost:9200/_cluster/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.6.0
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: "admin"
      OPENSEARCH_PASSWORD: "ChangeMe_123!"
      OPENSEARCH_SSL_VERIFICATIONMODE: "none"
    ports:
      - "5601:5601"
    volumes:
      - ./observability/opensearch-dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u admin:ChangeMe_123! http://localhost:5601/api/status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  opensearch-dashboards-init:
    image: python:3.12-alpine
    command: ["python", "/init/init-opensearch-dashboards.py"]
    restart: "no"
    environment:
      OPENSEARCH_DASHBOARDS_URL: "http://opensearch-dashboards:5601"
      OPENSEARCH_ENDPOINT: "https://opensearch:9200"
      OPENSEARCH_USER: "admin"
      OPENSEARCH_PASSWORD: "ChangeMe_123!"
      OPENSEARCH_WORKSPACE_NAME: ${OPENSEARCH_WORKSPACE_NAME:-reservas_app}
      PROMETHEUS_HOST: "prometheus"
      PROMETHEUS_PORT: "9090"
    volumes:
      - ./observability/opensearch-dashboards/init:/init:ro
    depends_on:
      opensearch-dashboards:
        condition: service_healthy

  data-prepper:
    image: opensearchproject/data-prepper:2.15.0
    environment:
      OPENSEARCH_USERNAME: "admin"
      OPENSEARCH_PASSWORD: "ChangeMe_123!"
    volumes:
      - ./observability/data-prepper/pipelines/traces-pipeline.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./observability/data-prepper/dlq:/usr/share/data-prepper/dlq
      - ./observability/data-prepper/config/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    ports:
      - "21890:21890" # OTLP gRPC para traces/logs desde OTel Collector
      - "4900:4900"   # Data Prepper API
    depends_on:
      opensearch:
        condition: service_healthy
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.8.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
      - "--web.route-prefix=/"
      - "--enable-feature=exemplar-storage"
      - "--web.enable-otlp-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  opensearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.10.0
    command:
      - "--es.uri=https://opensearch:9200"
      - "--es.ssl-skip-verify"
      - "--es.all"
      - "--es.indices"
      - "--es.shards"
    environment:
      ES_USERNAME: "admin"
      ES_PASSWORD: "ChangeMe_123!"
    ports:
      - "9114:9114"
    depends_on:
      opensearch:
        condition: service_healthy

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.150.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    mem_limit: 512m
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Métricas internas del collector para scrape
    depends_on:
      data-prepper:
        condition: service_started
      prometheus:
        condition: service_started

  room-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: room-service
    environment:
      SERVICE_NAME: room-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      STARTUP_SEED: "true"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started

  user-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    environment:
      SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    ports:
      - "8082:8000"
    depends_on:
      otel-collector:
        condition: service_started

  reservation-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: reservation-service
    environment:
      SERVICE_NAME: reservation-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      REDIS_URL: redis://redis:6379/0
      ROOM_SERVICE_URL: http://room-service:8000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    ports:
      - "8083:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

  notification-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      SERVICE_NAME: notification-service
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    ports:
      - "8084:8000"
    depends_on:
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

  api-gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      SERVICE_NAME: api-gateway
      ROOM_SERVICE_URL: http://room-service:8000
      RESERVATION_SERVICE_URL: http://reservation-service:8000
      USER_SERVICE_URL: http://user-service:8000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    ports:
      - "8080:8000"
    depends_on:
      - room-service
      - reservation-service
      - otel-collector

# Comandos útiles:
# docker compose up -d --build
# Acceso Room Service: http://localhost:8081/rooms
# Acceso User Service: http://localhost:8082/users/1
# Acceso Reservation Service: http://localhost:8083/docs
# Acceso Notification Service: http://localhost:8084/health
# OpenSearch API: https://localhost:9200
# OpenSearch Dashboards: http://localhost:5601
# Data Prepper API: http://localhost:4900
# Prometheus: http://localhost:9090
