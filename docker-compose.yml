services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reservas_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reservas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  room-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: room-service
    environment:
      SERVICE_NAME: room-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      STARTUP_SEED: "true"
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy

  user-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    environment:
      SERVICE_NAME: user-service
    ports:
      - "8082:8000"

  reservation-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: reservation-service
    environment:
      SERVICE_NAME: reservation-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      REDIS_URL: redis://redis:6379/0
      ROOM_SERVICE_URL: http://room-service:8000
    ports:
      - "8083:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  notification-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      SERVICE_NAME: notification-service
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8084:8000"
    depends_on:
      redis:
        condition: service_started

  api-gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      SERVICE_NAME: api-gateway
      ROOM_SERVICE_URL: http://room-service:8000
      RESERVATION_SERVICE_URL: http://reservation-service:8000
      USER_SERVICE_URL: http://user-service:8000
    ports:
      - "8080:8000"
    depends_on:
      - room-service
      - reservation-service

# Comando útil:
#   docker compose -f docker-compose.yml -f docker-compose.elastic.yml up -d --build
