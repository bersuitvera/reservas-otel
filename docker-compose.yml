volumes:
  elasticsearch-data:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reservas_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reservas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-changeme} http://localhost:9200/_cluster/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.3
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      XPACK_SECURITY_ENABLED: "true"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY:-reservas-otel-dev-encrypted-saved-objects-key-32}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:-reservas-otel-dev-security-encryption-key-32}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:-reservas-otel-dev-reporting-encryption-key-32}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  edot-collector:
    image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.3.3
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
    volumes:
      - ./observability/edot-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy

  room-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: room-service
    environment:
      SERVICE_NAME: room-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      STARTUP_SEED: "true"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://edot-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://edot-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://edot-collector:4318/v1/metrics
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
      edot-collector:
        condition: service_started

  user-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    environment:
      SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://edot-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://edot-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://edot-collector:4318/v1/metrics
    ports:
      - "8082:8000"
    depends_on:
      edot-collector:
        condition: service_started

  reservation-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: reservation-service
    environment:
      SERVICE_NAME: reservation-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      REDIS_URL: redis://redis:6379/0
      ROOM_SERVICE_URL: http://room-service:8000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://edot-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://edot-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://edot-collector:4318/v1/metrics
    ports:
      - "8083:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      edot-collector:
        condition: service_started

  notification-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      SERVICE_NAME: notification-service
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://edot-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://edot-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://edot-collector:4318/v1/metrics
    ports:
      - "8084:8000"
    depends_on:
      redis:
        condition: service_started
      edot-collector:
        condition: service_started

  api-gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      SERVICE_NAME: api-gateway
      ROOM_SERVICE_URL: http://room-service:8000
      RESERVATION_SERVICE_URL: http://reservation-service:8000
      USER_SERVICE_URL: http://user-service:8000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://edot-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://edot-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://edot-collector:4318/v1/metrics
    ports:
      - "8080:8000"
    depends_on:
      - room-service
      - reservation-service
      - edot-collector
