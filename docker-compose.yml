volumes:
  elasticsearch-data:
  kibana-config:

x-elastic-apm-env: &elastic-apm-env
  ELASTIC_APM_SERVER_URL: http://apm-server:8200
  ELASTIC_APM_ENVIRONMENT: dev
  ELASTIC_APM_SERVICE_VERSION: 0.1.0
  ELASTIC_APM_ENABLE_LOG_CORRELATION: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reservas_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reservas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-changeme} http://localhost:9200/_cluster/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    user: root
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY: ${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY:-reservas-elastic-dev-encrypted-saved-objects-key-32}
      KIBANA_SECURITY_ENCRYPTION_KEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:-reservas-elastic-dev-security-encryption-key-32}
      KIBANA_REPORTING_ENCRYPTION_KEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:-reservas-elastic-dev-reporting-encryption-key-32}
    command:
      - bash
      - -c
      - |
        set -euo pipefail

        until curl -s -u "elastic:$${ELASTIC_PASSWORD}" http://elasticsearch:9200/_cluster/health >/dev/null; do
          sleep 2
        done

        curl -s -u "elastic:$${ELASTIC_PASSWORD}" \
          -X DELETE \
          http://elasticsearch:9200/_security/service/elastic/kibana/credential/token/reservas-kibana >/dev/null || true

        response="$$(curl -s -u "elastic:$${ELASTIC_PASSWORD}" \
          -X POST \
          http://elasticsearch:9200/_security/service/elastic/kibana/credential/token/reservas-kibana)"
        token="$$(printf '%s' "$${response}" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"

        if [ -z "$${token}" ]; then
          printf 'No se pudo crear el service account token de Kibana: %s\n' "$${response}" >&2
          exit 1
        fi

        {
          printf '%s\n' 'server.host: 0.0.0.0'
          printf '%s\n' 'elasticsearch.hosts: ["http://elasticsearch:9200"]'
          printf 'elasticsearch.serviceAccountToken: "%s"\n' "$${token}"
          printf '%s\n' 'monitoring.ui.container.elasticsearch.enabled: true'
          printf 'xpack.encryptedSavedObjects.encryptionKey: "%s"\n' "$${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY}"
          printf 'xpack.security.encryptionKey: "%s"\n' "$${KIBANA_SECURITY_ENCRYPTION_KEY}"
          printf 'xpack.reporting.encryptionKey: "%s"\n' "$${KIBANA_REPORTING_ENCRYPTION_KEY}"
        } > /kibana-config/kibana.yml
        chmod 0644 /kibana-config/kibana.yml
    volumes:
      - kibana-config:/kibana-config
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.3
    ports:
      - "5601:5601"
    volumes:
      - kibana-config:/usr/share/kibana/config:ro
    depends_on:
      kibana-setup:
        condition: service_completed_successfully

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.3.3
    command: ["--strict.perms=false", "-e"]
    environment:
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
    volumes:
      - ./observability/apm-server/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    ports:
      - "8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy

  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.3.3
    command: ["elastic-agent", "run", "-e", "-c", "/usr/share/elastic-agent/elastic-agent.yml"]
    user: root
    environment:
      FLEET_ENROLL: "0"
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
    volumes:
      - ./observability/elastic-agent/elastic-agent.yml:/usr/share/elastic-agent/elastic-agent.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  room-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: room-service
    environment:
      <<: *elastic-apm-env
      SERVICE_NAME: room-service
      ELASTIC_APM_SERVICE_NAME: room-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      STARTUP_SEED: "true"
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
      apm-server:
        condition: service_started

  user-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    environment:
      <<: *elastic-apm-env
      SERVICE_NAME: user-service
      ELASTIC_APM_SERVICE_NAME: user-service
    ports:
      - "8082:8000"
    depends_on:
      apm-server:
        condition: service_started

  reservation-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: reservation-service
    environment:
      <<: *elastic-apm-env
      SERVICE_NAME: reservation-service
      ELASTIC_APM_SERVICE_NAME: reservation-service
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/reservas_db
      REDIS_URL: redis://redis:6379/0
      ROOM_SERVICE_URL: http://room-service:8000
    ports:
      - "8083:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      apm-server:
        condition: service_started

  notification-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      <<: *elastic-apm-env
      SERVICE_NAME: notification-service
      ELASTIC_APM_SERVICE_NAME: notification-service
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8084:8000"
    depends_on:
      redis:
        condition: service_started
      apm-server:
        condition: service_started

  api-gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      <<: *elastic-apm-env
      SERVICE_NAME: api-gateway
      ELASTIC_APM_SERVICE_NAME: api-gateway
      ROOM_SERVICE_URL: http://room-service:8000
      RESERVATION_SERVICE_URL: http://reservation-service:8000
      USER_SERVICE_URL: http://user-service:8000
    ports:
      - "8080:8000"
    depends_on:
      room-service:
        condition: service_started
      reservation-service:
        condition: service_started
      apm-server:
        condition: service_started

# Comando útil:
#   docker compose up -d --build
