# Prometheus configuration for reservas-otel observability stack.
global:
  scrape_interval: 60s
  scrape_timeout: 10s
  evaluation_interval: 60s
  external_labels:
    cluster: "reservas-otel-dev"
    environment: "development"

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          component: "metrics-storage"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: "otel-collector"
          component: "telemetry-ingestion"
    scrape_interval: 10s

  - job_name: "opensearch"
    static_configs:
      - targets: ["opensearch-exporter:9114"]
        labels:
          service: "opensearch"
          component: "search-storage"
    scrape_interval: 30s

  - job_name: "data-prepper"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets: ["data-prepper:4900"]
        labels:
          service: "data-prepper"
          component: "telemetry-processing"
    scrape_interval: 30s
