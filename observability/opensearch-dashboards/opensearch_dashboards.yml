# Needed in Docker so published port 5601 is reachable from host browser.
server.host: 0.0.0.0

# Keep OpenSearch connection in sync when security/TLS are enabled.
opensearch.hosts: ["https://opensearch:9200"]
opensearch.username: "admin"
opensearch.password: "ChangeMe_123!"
opensearch.ssl.verificationMode: none
data_source.ssl.verificationMode: none

# Enable workspace and observability/discover plugins used by the POC.
workspace.enabled: true
data_source.enabled: true
explore.enabled: true
explore.discoverTraces.enabled: true
explore.discoverMetrics.enabled: true
datasetManagement.enabled: true

# Workspace + security compatibility.
opensearch_security.multitenancy.enabled: false
opensearch.requestHeadersAllowlist: ["securitytenant", "Authorization"]

uiSettings:
  overrides:
    "home:useNewHomePage": true
