# Unified OTLP entrypoint:
# - receives traces/logs on port 21890
# - routes by signal type to dedicated internal pipelines
entry-pipeline:
  delay: "100"

  source:
    otlp:
      port: 21890
      ssl: false
      unframed_requests: true
      health_check_service: true
      output_format: otel

  route:
    # getEventType() is produced by output_format: otel.
    - traces: 'getEventType() == "TRACE"'
    - logs: 'getEventType() == "LOG"'

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  sink:
    - pipeline:
        name: traces-raw-pipeline
        routes:
          - traces

    - pipeline:
        name: service-map-pipeline
        routes:
          - traces

    - pipeline:
        name: service-map-legacy-pipeline
        routes:
          - traces

    - pipeline:
        name: logs-pipeline
        routes:
          - logs

traces-raw-pipeline:
  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  processor:
    - otel_traces:

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: trace-analytics-plain-raw
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/traces-raw.dlq


service-map-pipeline:
  delay: "100"

  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  processor:
    - otel_apm_service_map:
        group_by_attributes: [telemetry.sdk.language]
        window_duration: 10s

  route:
    - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
    - service_processed_metrics: 'getEventType() == "METRIC"'

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: otel-v2-apm-service-map
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/service-map.dlq
        routes: [otel_apm_service_map_route]
    - prometheus:
        url: "http://prometheus:9090/api/v1/write"
        insecure: true
        threshold:
          max_events: 500
          flush_interval: 5s
        routes: [service_processed_metrics]

logs-pipeline:
  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: log-analytics-plain
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/logs.dlq


# Compatibility pipeline for Trace Analytics service map view (v1).
service-map-legacy-pipeline:
  delay: "100"

  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  processor:
    - service_map:
        window_duration: 180

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: trace-analytics-service-map
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/service-map.dlq
