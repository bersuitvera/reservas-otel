# Unified OTLP entrypoint:
# - receives traces/logs/metrics on port 21890
# - routes by signal type to dedicated internal pipelines
entry-pipeline:
  delay: "100"

  source:
    otlp:
      port: 21890
      ssl: false
      unframed_requests: true
      health_check_service: true
      output_format: otel

  route:
    # getEventType() is produced by output_format: otel.
    - traces: 'getEventType() == "TRACE"'
    - logs: 'getEventType() == "LOG"'
    - metrics: 'getEventType() == "METRIC"'

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  sink:
    - pipeline:
        name: traces-raw-pipeline
        routes:
          - traces

    - pipeline:
        name: service-map-pipeline
        routes:
          - traces

    - pipeline:
        name: logs-pipeline
        routes:
          - logs

    - pipeline:
        name: metrics-pipeline
        routes:
          - metrics


traces-raw-pipeline:
  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  processor:
    - otel_traces:

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: trace-analytics-plain-raw
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/traces-raw.dlq


service-map-pipeline:
  delay: "100"

  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  processor:
    - service_map:
        window_duration: 180

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: trace-analytics-service-map
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/service-map.dlq


logs-pipeline:
  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: log-analytics-plain
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/logs.dlq


metrics-pipeline:
  source:
    pipeline:
      name: entry-pipeline

  buffer:
    bounded_blocking:
      buffer_size: 10240
      batch_size: 160

  processor:
    - otel_metrics:
        calculate_histogram_buckets: true
        calculate_exponential_histogram_buckets: true
        exponential_histogram_max_allowed_scale: 10
        flatten_attributes: true

  sink:
    - opensearch:
        hosts:
          - "http://opensearch:9200"
        index_type: metric-analytics-plain
        max_retries: 5
        dlq_file: /usr/share/data-prepper/dlq/metrics.dlq
        index: ss4o_metrics-otel-%{yyyy.MM.dd}
        bulk_size: 4

